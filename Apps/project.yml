name: Totem
options:
  bundleIdPrefix: com.deadsimple.totem
  # Floors set by the iroh package.
  deploymentTarget:
    iOS: "17.5"
    macOS: "14.5"
packages:
  TotemKit:
    path: ../TotemKit
  iroh-ffi:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    # Pass these on the xcodebuild command line (see install.sh and testflight.sh).
    TOTEM_TEAM_ID: ""
    TOTEM_SERVER_URL: ""
    TOTEM_DEV_SERVER_URL: ""
    TOTEM_TESTFLIGHT_APP_ID: ""
    TOTEM_TESTFLIGHT_JOIN_CODE: ""
    DEVELOPMENT_TEAM: $(TOTEM_TEAM_ID)
    # testflight.sh stamps distributed builds with a date-based build number.
    CURRENT_PROJECT_VERSION: "1"
    # Bumped by hand per release; each new value re-triggers Beta App Review.
    MARKETING_VERSION: "1.0"
targets:
  Totem-iOS:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TotemKit
      - package: iroh-ffi
        product: IrohLib
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleName: Totem
        CFBundleDisplayName: Totem
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Totem streams your voice live to buddies in an open chat.
        NSLocalNetworkUsageDescription: Totem sends chat data directly between your devices and your friends', not through a server.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TotemDefaultServerURL: $(TOTEM_SERVER_URL)
        TotemDevServerURL: $(TOTEM_DEV_SERVER_URL)
        TotemTestFlightAppID: $(TOTEM_TESTFLIGHT_APP_ID)
        TotemTestFlightJoinCode: $(TOTEM_TESTFLIGHT_JOIN_CODE)
  Totem-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: TotemKit
      - package: iroh-ffi
        product: IrohLib
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreWLAN.framework
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleName: Totem
        CFBundleDisplayName: Totem
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSUIElement: false
        NSMicrophoneUsageDescription: Totem streams your voice live to buddies in an open chat.
        TotemDefaultServerURL: $(TOTEM_SERVER_URL)
        TotemDevServerURL: $(TOTEM_DEV_SERVER_URL)
