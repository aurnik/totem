name: Totem
options:
  bundleIdPrefix: com.aurnik.totem
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  TotemKit:
    path: ../TotemKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: TKXA365JX2
    CODE_SIGN_STYLE: Automatic
    # Overridden by Server/onboard/sign.sh: distributed builds get a
    # date-stamped build number (drives the in-app update check) and a baked
    # default server URL. Dev builds stay at "1" (update check disabled).
    CURRENT_PROJECT_VERSION: "1"
    TOTEM_SERVER_URL: ""
targets:
  Totem-iOS:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TotemKit
    info:
      path: Generated/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Totem streams your voice live to buddies in an open chat.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TotemDefaultServerURL: $(TOTEM_SERVER_URL)
  Totem-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: TotemKit
    info:
      path: Generated/Info-macOS.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSUIElement: false
        NSMicrophoneUsageDescription: Totem streams your voice live to buddies in an open chat.
