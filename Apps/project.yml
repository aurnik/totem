name: Totem
options:
  bundleIdPrefix: com.aurnik.totem
  # Floors set by the iroh package.
  deploymentTarget:
    iOS: "17.5"
    macOS: "14.5"
packages:
  TotemKit:
    path: ../TotemKit
  iroh-ffi:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: TKXA365JX2
    CODE_SIGN_STYLE: Automatic
    # Overridden by Server/onboard/testflight.sh: distributed builds get a
    # date-stamped build number and a baked default server URL.
    CURRENT_PROJECT_VERSION: "1"
    # User-facing version. TestFlight only needs a unique build number per
    # marketing version, so this is bumped by hand at release time.
    MARKETING_VERSION: "1.0"
    TOTEM_SERVER_URL: ""
targets:
  Totem-iOS:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TotemKit
      - package: iroh-ffi
        product: IrohLib
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
    info:
      path: Generated/Info-iOS.plist
      properties:
        # Target is Totem-iOS so the scheme/IPA names stay distinct, but the
        # home screen must read "Totem".
        CFBundleName: Totem
        CFBundleDisplayName: Totem
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Totem streams your voice live to buddies in an open chat.
        NSLocalNetworkUsageDescription: Live voice travels directly between your devices and your friends', not through a server.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TotemDefaultServerURL: $(TOTEM_SERVER_URL)
  Totem-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: TotemKit
      - package: iroh-ffi
        product: IrohLib
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreWLAN.framework
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleName: Totem
        CFBundleDisplayName: Totem
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSUIElement: false
        NSMicrophoneUsageDescription: Totem streams your voice live to buddies in an open chat.
